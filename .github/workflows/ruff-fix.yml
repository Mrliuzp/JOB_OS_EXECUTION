name: 临时整理 Python 代码

on:
  push:
    branches:
      - feat/wp-002-024-complete

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != '修复：自动整理 Python 导入和格式'
    runs-on: ubuntu-latest
    steps:
      - name: 检出功能分支
        uses: actions/checkout@v4
        with:
          ref: feat/wp-002-024-complete
          fetch-depth: 0
      - name: 安装 Ruff
        run: python -m pip install 'ruff>=0.12,<1'
      - name: 整理导入和代码格式
        run: |
          python -m ruff check --fix .
          python -m ruff format .
      - name: 提交整理结果
        run: |
          git config user.name 'Mrliuzp'
          git config user.email '44855363+Mrliuzp@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '修复：自动整理 Python 导入和格式'
          git push origin HEAD:feat/wp-002-024-complete
