name: 临时修复类型声明

on:
  push:
    branches:
      - feat/wp-002-024-complete

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != '修复：完善类型收窄与第三方类型声明'
    runs-on: ubuntu-latest
    steps:
      - name: 检出功能分支
        uses: actions/checkout@v4
        with:
          ref: feat/wp-002-024-complete
          fetch-depth: 0
      - name: 修复已确认的类型问题
        shell: python
        run: |
          from pathlib import Path

          parser = Path('jobos/providers/boss/parser.py')
          content = parser.read_text(encoding='utf-8')
          content = content.replace(
              'return _text(target) if target else None',
              'return _text(target) if target is not None else None',
          )
          parser.write_text(content, encoding='utf-8')

          service = Path('jobos/services/communication_service.py')
          content = service.read_text(encoding='utf-8')
          content = content.replace(
              '        selected = mapping.get(',
              '        selected: tuple[MessageType, RiskLevel, list[str]] = mapping.get(',
          )
          service.write_text(content, encoding='utf-8')

          project = Path('pyproject.toml')
          content = project.read_text(encoding='utf-8')
          content = content.replace(
              '    "types-pyyaml>=6.0,<7",\n',
              '    "types-jsonschema>=4.23,<5",\n    "types-pyyaml>=6.0,<7",\n',
          )
          project.write_text(content, encoding='utf-8')
      - name: 提交类型修复
        run: |
          git config user.name 'Mrliuzp'
          git config user.email '44855363+Mrliuzp@users.noreply.github.com'
          git add jobos/providers/boss/parser.py jobos/services/communication_service.py pyproject.toml
          git commit -m '修复：完善类型收窄与第三方类型声明'
          git push origin HEAD:feat/wp-002-024-complete
