name: Bootstrap Web Lock

on:
  push:
    branches:
      - feat/wp-001-bootstrap

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wp-001-bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Generate package lock
        run: npm install --package-lock-only
      - name: Commit package lock
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "chore(web): add npm package lock"
            git push origin HEAD:feat/wp-001-bootstrap
          fi
