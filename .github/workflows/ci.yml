name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobos
          POSTGRES_PASSWORD: jobos
          POSTGRES_DB: jobos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobos -d jobos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOBOS_TEST_POSTGRES_URL: postgresql+psycopg://jobos:jobos@127.0.0.1:5432/jobos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Ruff 静态检查
        run: python -m ruff check .
      - name: Ruff 格式检查
        run: python -m ruff format --check .
      - name: Mypy 类型检查
        run: python -m mypy jobos apps
      - name: 数据库迁移往返验证
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
      - name: Pytest 测试与覆盖率
        run: python -m pytest --cov=jobos --cov=apps

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装前端依赖
        run: npm ci
      - name: ESLint 静态检查
        run: npm run lint
      - name: TypeScript 类型检查
        run: npm run type-check
      - name: Vitest 单元测试
        run: npm run test
      - name: Vite 生产构建
        run: npm run build
