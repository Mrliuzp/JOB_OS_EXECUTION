[project]
name = "jobos-cn"
version = "0.2.0"
description = "面向国内兼职与远程岗位的本地优先 AI 求职操作系统"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "Mrliuzp"}]
keywords = ["job-search", "automation", "ai", "resume", "china", "remote-work"]
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "jsonschema>=4.23,<5",
    "keyring>=25,<26",
    "playwright>=1.54,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6.0,<7",
    "rich>=14.0,<15",
    "sqlalchemy>=2.0,<3",
    "structlog>=25.4,<26",
    "typer>=0.16,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.10,<8",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0,<7",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
jobos = "apps.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jobos*", "apps*"]
exclude = ["tests*", "src*"]

[tool.setuptools.package-data]
"jobos.providers.boss" = ["selectors/*.yaml"]
"jobos.artifacts" = ["resume_templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "auto"
markers = [
    "integration: 数据库或多个组件集成测试",
    "contract: Provider 合同测试",
    "e2e: 端到端业务流程测试",
]

[tool.coverage.run]
branch = true
source = ["jobos", "apps"]
omit = [
    "*/__init__.py",
    "*/migrations/*",
    "tests/*",
    "apps/cli/main.py",
    "apps/worker/main.py",
    "jobos/browser/session_manager.py",
    "jobos/llm/providers.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/applypilot", "apps/web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501", # 长行由 Ruff formatter 与前端工具链分别处理。
    "B008", # Typer 和 FastAPI 约定在函数默认值中声明依赖与选项。
    "B904", # CLI 会将底层异常转换为面向用户的领域错误。
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["^src/applypilot/", "^jobos/infrastructure/migrations/"]
