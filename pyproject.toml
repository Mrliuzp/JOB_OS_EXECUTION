[project]
name = "jobos-cn"
version = "0.1.0"
description = "Local-first AI job search operating system for part-time and remote roles in China"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "Mrliuzp"}]
keywords = ["job-search", "automation", "ai", "resume", "china", "remote-work"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "playwright>=1.54,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6.0,<7",
    "rich>=14.0,<15",
    "sqlalchemy>=2.0,<3",
    "structlog>=25.4,<26",
    "typer>=0.16,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.10,<8",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0,<7",
]

[project.scripts]
jobos = "apps.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jobos*", "apps*"]
exclude = ["tests*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["jobos", "apps"]
omit = [
    "*/__init__.py",
    "*/migrations/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "src/applypilot",
    "apps/web",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = ["^src/applypilot/"]
